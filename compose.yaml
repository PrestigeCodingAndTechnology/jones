services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: jones_kicks
    volumes:
      - jones_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      APP_URL: http://localhost:5000
      MONGODB_URI: mongodb://mongo:27017/jones_kicks
      MONGODB_TRANSACTIONS: "false"
      SESSION_SECRET: local-docker-session-secret-change-before-hosting
      ADMIN_NAME: Jones Kicks Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@joneskick.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PAYMENT_MODE: demo
      TRUST_PROXY: 0
    ports:
      - "5000:5000"
    volumes:
      - jones_uploads:/app/public/uploads

volumes:
  jones_mongo:
  jones_uploads:
