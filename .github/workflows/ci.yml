name: Jones Kicks CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Project feature checks
        run: npm run check
      - name: Automated tests
        env:
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-that-is-long-enough-for-jones-kicks
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev
